name: Port contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DO_NOT_TRACK: '1'
      MCODE_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm audit --audit-level=moderate
      - name: Explain live acceptance boundary
        run: echo 'No model calls, user histories, GitHub writes or automatic formal-tool downloads. Installed-host and live-model acceptance are separate release checks.'
